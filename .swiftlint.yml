excluded:
  - .build

disabled_rules:
  - opening_brace
  - trailing_comma

cyclomatic_complexity:
  warning: 10
  error: 15

file_length:
  warning: 500
  error: 800

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 500
